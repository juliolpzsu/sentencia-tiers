name: Pruebas del modelo

on:
  push:
    branches: [main]
    paths: ['build/**', 'data/**', 'tests/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['build/**', 'data/**', 'tests/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -I -m unittest discover -s tests -v
